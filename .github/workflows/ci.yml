name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Use .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ECommerce.sln

      - name: Build
        run: dotnet build ECommerce.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ECommerce.Api.Products.Tests --configuration Release --no-build --verbosity normal

      - name: Publish
        run: |
          for service in Products Customers Orders Search; do
            dotnet publish ECommerce.Api.$service --configuration Release --no-build --output publish/$service -p:UseAppHost=false
          done

      - name: Publish artifacts
        uses: actions/upload-artifact@v7
        with:
          name: microservices
          path: publish
          if-no-files-found: error

  docker-compose-smoke-test:
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build the images and start the containers
        run: docker compose up --build --detach

      - name: Check the microservices
        run: |
          wait_for() {
            for _ in $(seq 1 30); do
              if curl --fail --silent "$1" > /dev/null; then
                return 0
              fi
              sleep 2
            done
            echo "Timed out waiting for $1"
            return 1
          }

          wait_for http://localhost:6001/api/products
          wait_for http://localhost:6002/api/customers
          wait_for http://localhost:6003/api/orders/1

          response=""
          for _ in $(seq 1 30); do
            if response=$(curl --fail --silent --request POST \
                --header 'Content-Type: application/json' \
                --data '{"customerId":1}' \
                http://localhost:6004/api/search); then
              break
            fi
            sleep 2
          done
          echo "$response"

          # Real names (not the "information is not available" fallbacks) prove that
          # Search reached the Customers, Orders and Products containers.
          grep --quiet '"name":"Jessica Smith"' <<< "$response"
          grep --quiet '"productName":"Keyboard"' <<< "$response"

      - name: Container logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop the containers
        if: always()
        run: docker compose down --volumes
